<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />

  <title>لوحة إدارة الطلبات</title>
  <script>
    (function() {
      var stored = localStorage.getItem('recon-theme');
      var theme = stored ? stored : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Sora:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'Sora', 'sans-serif'],
            mono: ['Sora', 'monospace'],
            display: ['"Reem Kufi"', 'sans-serif'],
          },
          colors: {
            bg: 'var(--bg)',
            surface: 'var(--surface)',
            'surface-2': 'var(--surface-2)',
            ink: 'var(--ink)',
            'ink-soft': 'var(--ink-soft)',
            'ink-faint': 'var(--ink-faint)',
            line: 'var(--line)',
            brand: 'var(--brand)',
            pos: 'var(--pos)',
            neg: 'var(--neg)',
            warn: 'var(--warn)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #ECEFF3;
      --vignette: radial-gradient(circle at top, rgba(0,0,0,0.03), transparent 60%);
      --surface: #FFFFFF;
      --surface-2: #F6F8FA;
      --ink: #0B1220;
      --ink-soft: #475063;
      --ink-faint: #8A93A3;
      --line: #E2E7EE;
      --brand: #0F766E;
      --pos: #059669;
      --neg: #E11D48;
      --warn: #D97706;
      --bg-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    
    [data-theme="console"] {
      --bg: #0B1118;
      --vignette: radial-gradient(circle at top, rgba(255,255,255,0.03), transparent 60%);
      --surface: #121A24;
      --surface-2: #0E1620;
      --ink: #E6EDF3;
      --ink-soft: #9AA7B6;
      --ink-faint: #6E7A8A;
      --line: #1E2A37;
      --brand: #2DD4BF;
      --pos: #34D399;
      --neg: #FB7185;
      --warn: #FBBF24;
    }
    
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Tajawal', 'Sora', sans-serif;
      position: relative;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: var(--bg-grain);
      opacity: 0.04;
      pointer-events: none;
      z-index: -1;
    }
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; height: 100vh;
      background: var(--vignette);
      pointer-events: none;
      z-index: -1;
    }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-faint);
    }
    
    .tabular-nums { font-variant-numeric: tabular-nums; }
    
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    
    /* Sheen animation */
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .sheen::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: sweep 6s infinite linear;
      pointer-events: none;
    }
    
    [data-theme="console"] .surface-highlight {
      border-top: 1px solid rgba(255,255,255,0.08);
      box-shadow: none;
    }
    .surface-highlight {
      border-top: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="min-h-screen">
  
<div id="boot-splash" style="position:fixed;inset:0;z-index:9999;background-color:#ECEFF3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Reem Kufi', sans-serif;">
  <div style="font-size:24px;font-weight:700;color:#0B1220;margin-bottom:24px;">لوحة إدارة الطلبات</div>
  <div style="width:200px;height:4px;background-color:rgba(15, 118, 110, 0.2);border-radius:2px;overflow:hidden;position:relative;">
    <div id="splash-progress" style="position:absolute;left:0;top:0;height:100%;width:40%;background-color:#0F766E;border-radius:2px;transition:left 0.5s ease-in-out;"></div>
  </div>
  <style>
    @keyframes sweep {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    #splash-progress {
      animation: sweep 1.5s infinite ease-in-out;
    }
  </style>
  <div style="margin-top:12px;font-size:12px;color:#0B1220;opacity:0.7;font-family:'Tajawal', sans-serif;">جارٍ التحميل…</div>
</div>

    <div id="root" dir="rtl"></div>
  <script>
    

    const round3 = (x) => {
      const n = Math.round((Number(x) || 0) * 1000) / 1000;
      return isNaN(n) ? 0 : n;
    };

    const formatTND = (x) => round3(x).toFixed(3).replace(".", ",");

    const parseMoney = (raw) => {
      if (raw == null) return { value: 0, bad: false };
      let s = String(raw).trim();
      s = s.replace(/DT|TND|د\.?ت\.?|دينار|\$|€|\s|\u00A0/g, "");
      if (s === "") return { value: 0, bad: false };
      
      if (s.includes(",") && s.includes(".")) {
        const firstComma = s.indexOf(",");
        const firstDot = s.indexOf(".");
        if (firstComma < firstDot) {
          s = s.replace(/,/g, "");
        } else {
          s = s.replace(/\./g, "").replace(/,/g, ".");
        }
      } else if (s.includes(",")) {
        const lastComma = s.lastIndexOf(",");
        const afterComma = s.substring(lastComma + 1);
        if (afterComma.length >= 1 && afterComma.length <= 3) {
          s = s.substring(0, lastComma).replace(/,/g, "") + "." + afterComma;
        } else {
          s = s.replace(/,/g, "");
        }
      }
      
      const n = Number(s.replace(/[^0-9.\-]/g, ""));
      if (!isFinite(n) || isNaN(n)) return { value: 0, bad: true };
      return { value: round3(n), bad: false };
    };

    const normalizeId = (raw) => String(raw ?? '').trim().replace(/\s+/g,' ').toLowerCase();
    const normalizeCity = (raw) => {
      if (!raw) return "";
      return String(raw)
        .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[.,/#!$%\^&\*;:{}=\-_~()]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    };

    const GOV_ALIASES = {
      "GRAND_TUNIS.TUNIS": ["tunis", "tunez", "tunes", "تونس", "تونس المدينة", "la marsa", "المرسى", "marsa", "carthage", "قرطاج", "le bardo", "باردو", "bardo", "sidi hassine", "el omrane", "ettadhamen", "hrairia", "jebel jelloud", "el kabaria", "sidi el bechir", "bab bhar", "bab souika", "la goulette", "حلق الوادي", "goulette", "kram", "الكرم", "sidi bou said", "سيدي بوسعيد"],
      "GRAND_TUNIS.ARIANA": ["ariana", "أريانة", "aryanah", "arianah", "la soukra", "السوكرة", "soukra", "raoued", "رواد", "روّاد", "kalaat el andalous", "sidi thabet", "mnihla", "المنيهلة", "اريانة المدينة", "ariana ville", "ariana medina"],
      "GRAND_TUNIS.BEN_AROUS": ["ben arous", "بن عروس", "بنعرس", "el mourouj", "المروج", "mourouj", "hammam-lif", "hammam lif", "حمام الانف", "hammam chott", "ezzahra", "rades", "رادس", "megrine", "megarine", "mornag", "fouchana", "mohamedia", "bou mhel el bassatine"],
      "GRAND_TUNIS.MANNOUBA": ["mannouba", "manouba", "la manouba", "منوبة", "المنوبة", "oued ellil", "وادي الليل", "mornaguia", "borj el amri", "douar hicher", "el batan", "tebourba", "طبربة", "jedaida", "الجديدة"]
    };

    const REVERSE_GOV = new Map();
    for (const [id, aliases] of Object.entries(GOV_ALIASES)) {
      for (const alias of aliases) {
        REVERSE_GOV.set(normalizeCity(alias), id);
      }
    }

    const resolveGov = (raw) => {
      const norm = normalizeCity(raw);
      if (!norm) return { canonical: "OTHER", isGrandTunis: false, unknown: false, raw: raw };
      const id = REVERSE_GOV.get(norm);
      return { 
        canonical: id ?? "OTHER", 
        isGrandTunis: !!id && id.startsWith("GRAND_TUNIS"), 
        unknown: id == null,
        raw: raw
      };
    };

    const statusBucket = (codeOrLabel) => {
      const s = String(codeOrLabel).trim().toLowerCase();
      if (["5000", "livre", "livré", "delivered", "تم التسليم", "مسلم", "مسلّم"].includes(s)) return "delivered";
      if (["6900", "retourne", "retourné", "returned", "retour reçu", "مسترجع", "مرتجع", "تم الارجاع"].includes(s)) return "returned";
      if (["1100", "1101", "1102", "9000", "9001", "9002", "9003", "9004", "annule", "annulé", "cancelled", "ملغى", "ملغي"].includes(s)) return "cancelled";
      if (["6500", "exchange", "تبادل"].includes(s)) return "exchange";
      if (["6000", "6001", "3201", "return_in_progress"].includes(s)) return "return_in_progress";
      return "in_progress";
    };


    // Detect template type
    function findHeaderAndScore(rows) {
      if (!rows || rows.length === 0) return { template: 'UNKNOWN', headerIdx: 0 };
      
      let bestScore = 0;
      let bestTemplate = 'UNKNOWN';
      let bestIdx = 0;

      const scanLimit = Math.min(8, rows.length);
      for (let i = 0; i < scanLimit; i++) {
        const r = rows[i];
        if (!r) continue;
        const h = r.map(c => String(c ?? '').trim().toLowerCase());
        
        let convertyScore = 0;
        if (h.includes('designation')) convertyScore++;
        if (h.includes('prix')) convertyScore++;
        if (h.includes('etat')) convertyScore++;
        
        let intigoScore = 0;
        if (h.includes('nid')) intigoScore++;
        if (h.includes('ville')) intigoScore++;
        if (h.includes('statut')) intigoScore++;
        if (h.some(x => x.includes('prix cod'))) intigoScore++;
        if (h.includes('frais')) intigoScore++;
        
        const firstCell = String(r[0] ?? '').trim().toLowerCase();
        let logistaScore = 0;
        if (firstCell.startsWith('détails paiement') || firstCell.startsWith('details paiement')) logistaScore = 5;

        if (logistaScore >= 5 && logistaScore > bestScore) { bestScore = logistaScore; bestTemplate = 'LOGISTA'; bestIdx = i; }
        else if (intigoScore >= 4 && intigoScore > bestScore) { bestScore = intigoScore; bestTemplate = 'INTIGO'; bestIdx = i; }
        else if (convertyScore >= 3 && convertyScore > bestScore) { bestScore = convertyScore; bestTemplate = 'CONVERTY'; bestIdx = i; }
      }
      
      return { template: bestTemplate, headerIdx: bestIdx };
    }

    function detectTemplate(rows) {
      return findHeaderAndScore(rows).template;
    }

    function parseConverty(rows) {
      const { headerIdx } = findHeaderAndScore(rows);
      const header = rows[headerIdx];
      const data = rows.slice(headerIdx + 1);
      
      const h = header.map(c => String(c ?? '').trim().toLowerCase());
      const get = (row, col) => row[h.indexOf(col)];
      const getFlexible = (row, cols) => {
        for (let col of cols) {
          const idx = h.findIndex(c => c.includes(col));
          if (idx > -1 && row[idx] !== undefined) return row[idx];
        }
        return undefined;
      };
      
      const duplicateNids = [];
      const seenNids = new Set();

      const parsed = data
        .filter(row => {
          const state = String(get(row, 'etat') ?? '').trim().toLowerCase();
          const bucket = statusBucket(state);
          return bucket === 'delivered' || bucket === 'returned' || bucket === 'cancelled' || bucket === 'exchange' || bucket === 'return_in_progress' || state.includes('livré') || state.includes('livre') || state.includes('retour') || state.includes('annul');
        })
        .map(row => {
          const state = String(get(row, 'etat') ?? '').trim().toLowerCase();
          const bucket = statusBucket(state);
          // For legacy compatibility where bucket doesn't map directly, fallback
          const isDelivered = bucket === 'delivered' || state.includes('livré') || state.includes('livre');
          const isReturned = bucket === 'returned' || (state.includes('retour') && !state.includes('en cours'));
          
          let parsedBucket = bucket;
          if (bucket === 'in_progress' || bucket === 'other') {
             if (isDelivered) parsedBucket = 'delivered';
             else if (isReturned) parsedBucket = 'returned';
             else if (state.includes('annul')) parsedBucket = 'cancelled';
          }
          
          let phone = String(getFlexible(row, ['téléphone', 'telephone', 'tel', 'phone']) ?? '').trim();
          let priceObj = parseMoney(get(row, 'prix'));
          
          return {
            id: crypto.randomUUID(),
            barcode: String(getFlexible(row, ['code', 'tracking', 'nid']) ?? '').trim(),
            productName: String(get(row, 'designation') ?? '—').trim() || '—',
            phone: phone,
            totalSales: parsedBucket === 'delivered' ? priceObj.value : 0,
            status: parsedBucket,
            carrier_fee: null,
            rule_fee: 0,
            fee_delta: null,
            moneyParseError: priceObj.bad,
            city: ''
          };
        })
        .filter(row => {
           if (!row.barcode) return true;
           const norm = normalizeId(row.barcode); // Just simple normalize
           if (seenNids.has(norm)) {
             duplicateNids.push(row.barcode);
             return false;
           }
           seenNids.add(norm);
           return true;
        });
        
      return { rows: parsed, autoFees: null, duplicateNids: [...new Set(duplicateNids)] };
    }

    function parseLogista(rows) {
      const { headerIdx: globalHeaderIdx } = findHeaderAndScore(rows);
      
      const findRow = (startIdx, kw1, kw2) => {
        const idx = rows.slice(startIdx).findIndex(r =>
          r && r.some(c => String(c ?? '').toLowerCase().includes(kw1.toLowerCase())) &&
          (!kw2 || r.some(c => String(c ?? '').toLowerCase().includes(kw2.toLowerCase())))
        );
        return idx > -1 ? startIdx + idx : -1;
      };
      
      const findRowSingle = (startIdx, kw) => {
        const idx = rows.slice(startIdx).findIndex(r =>
          r && String(r[0] ?? '').trim().toLowerCase().startsWith(kw.toLowerCase())
        );
        return idx > -1 ? startIdx + idx : -1;
      };

      const deliveredHeaderIdx = findRow(globalHeaderIdx, 'Code Barres', 'TTC');
      if (deliveredHeaderIdx === -1) throw new Error('لم يتم العثور على جدول التسليم في ملف Logista');
      const deliveredEndIdx = findRowSingle(deliveredHeaderIdx, 'total liv');
      
      const isDataRow = (r) => {
        if (!r) return false;
        const first = String(r[0] ?? '').trim();
        return first !== '' && !first.toLowerCase().startsWith('total') && first.toLowerCase() !== 'code barres' && /\d/.test(first);
      };
      
      const deliveredData = rows
        .slice(deliveredHeaderIdx + 1, deliveredEndIdx > -1 ? deliveredEndIdx : undefined)
        .filter(isDataRow);

      let returnHeaderIdx = findRow(deliveredEndIdx > -1 ? deliveredEndIdx : deliveredHeaderIdx, 'Code Barres', 'frais ret');
      if (returnHeaderIdx === -1 && deliveredEndIdx > -1) {
        const relIdx = rows.slice(deliveredEndIdx).findIndex(r => r && r.some(c => String(c ?? '').toLowerCase().includes('code barres')));
        if (relIdx > -1) returnHeaderIdx = deliveredEndIdx + relIdx;
      }
      const returnEndIdx = returnHeaderIdx > -1 ? findRowSingle(returnHeaderIdx, 'total ret') : -1;
      const returnData = returnHeaderIdx > -1
        ? rows.slice(returnHeaderIdx + 1, returnEndIdx > -1 ? returnEndIdx : undefined).filter(isDataRow)
        : [];

      const getPhoneIndex = (headerRow) => {
        if (!headerRow) return -1;
        return headerRow.findIndex(c => {
          const s = String(c ?? '').toLowerCase();
          return s.includes('téléphone') || s.includes('telephone') || s === 'tel' || s.includes('tél') || s.includes('phone');
        });
      };
      const delPhoneIdx = getPhoneIndex(rows[deliveredHeaderIdx]);
      const retPhoneIdx = returnHeaderIdx > -1 ? getPhoneIndex(rows[returnHeaderIdx]) : -1;
      
      const duplicateNids = [];
      const seenNids = new Set();
      
      const processRow = (row, isDelivered) => {
          const barcode = String(row[0] ?? '').trim();
          if (barcode) {
             const norm = normalizeId(barcode);
             if (seenNids.has(norm)) { duplicateNids.push(barcode); return null; }
             seenNids.add(norm);
          }
          
          let ttcStr = String(row[8] ?? '');
          let ttcObj = parseMoney(ttcStr);
          if (ttcObj.bad || ttcObj.value === 0) {
             ttcObj = parseMoney(String(row[9] ?? ''));
          }
          let phone = (isDelivered && delPhoneIdx > -1) ? String(row[delPhoneIdx] ?? '').trim() :
                      (!isDelivered && retPhoneIdx > -1) ? String(row[retPhoneIdx] ?? '').trim() : '';
          
          return {
            id: crypto.randomUUID(),
            barcode: barcode,
            productName: String(row[2] ?? '—').trim() || '—',
            phone: phone,
            totalSales: isDelivered ? ttcObj.value : 0,
            status: isDelivered ? 'delivered' : 'returned',
            carrier_fee: null,
            rule_fee: 0,
            fee_delta: null,
            moneyParseError: isDelivered ? ttcObj.bad : false,
            city: ''
          };
      };

      const parsedDelivered = deliveredData.map(r => processRow(r, true)).filter(Boolean);
      const parsedReturned = returnData.map(r => processRow(r, false)).filter(Boolean);

      let deliveryFee = 0;
      if (deliveredData.length > 0) {
        deliveryFee = parseMoney(deliveredData[0][10]).value;
      }
      let returnFee = 0;
      if (returnData.length > 0) {
        returnFee = parseMoney(returnData[0][10]).value;
      }

      return {
        rows: [...parsedDelivered, ...parsedReturned],
        autoFees: (deliveryFee || returnFee) ? { delivery: deliveryFee, return: returnFee } : null,
        duplicateNids: [...new Set(duplicateNids)]
      };
    }

    function parseIntigo(rows) {
      const { headerIdx } = findHeaderAndScore(rows);
      const header = rows[headerIdx];
      const data = rows.slice(headerIdx + 1);
      
      const h = header.map(c => String(c ?? '').trim().toLowerCase());
      
      const get = (row, colSubstring) => {
        const idx = h.findIndex(x => x === colSubstring || x.includes(colSubstring));
        return idx > -1 ? row[idx] : undefined;
      };
      
      const duplicateNids = [];
      const seenNids = new Set();
      const unrecognizedList = [];
      
      const parsed = data
        .map(row => {
          const state = String(get(row, 'statut') ?? '').trim();
          const norm = state.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
          
          let bucket = statusBucket(state);
          if (bucket === 'in_progress' && statusBucket(norm) !== 'in_progress') {
             bucket = statusBucket(norm);
          }
          
          if (bucket === 'in_progress') {
             if (norm.includes('livre') || norm.includes('livré') || norm.includes('delivered') || norm.includes('تم التسليم') || norm.includes('مسلم')) {
                bucket = 'delivered';
             } else if ((norm.includes('retour') || norm.includes('returned') || norm.includes('مرتجع') || norm.includes('مسترجع')) && 
                        !['en cours', 'cours', 'préparation', 'preparation', 'prêt', 'pret', 'transfert retour', '3201', '6000', '6001'].some(sub => norm.includes(sub))) {
                bucket = 'returned';
             } else if (norm.includes('annul') || norm.includes('cancelled') || norm.includes('ملغ')) {
                bucket = 'cancelled';
             } else if (norm.includes('échange') || norm.includes('echange') || norm.includes('exchange') || norm.includes('تبادل') || norm.includes('6500')) {
                bucket = 'exchange';
             } else if (/^\d+$/.test(state)) {
                bucket = 'in_progress';
             } else {
                bucket = 'unrecognized';
                unrecognizedList.push(state);
             }
          }
          
          let phone = '';
          const phoneIdx = h.findIndex(x => x.includes('téléphone') || x.includes('telephone') || x === 'tel' || x.includes('phone'));
          if (phoneIdx > -1) {
            phone = String(row[phoneIdx] ?? '').trim();
          }
          
          const nid = String(get(row, 'nid') ?? '').trim();
          if (nid) {
             const norm = normalizeId(nid);
             if (seenNids.has(norm)) { duplicateNids.push(nid); return null; }
             seenNids.add(norm);
          }
          
          let priceObj = parseMoney(get(row, 'prix cod'));
          let carrierFeeObj = parseMoney(get(row, 'frais'));
          let carrier_fee = get(row, 'frais') !== undefined ? carrierFeeObj.value : null;

          return {
            id: crypto.randomUUID(),
            nid: nid,
            city: String(get(row, 'ville') ?? '').trim(),
            productName: 'جاري التحميل...',
            phone: phone,
            totalSales: bucket === 'delivered' ? priceObj.value : 0,
            status: bucket,
            carrier: 'INTIGO',
            needsEnrichment: true,
            carrier_fee: carrier_fee,
            rule_fee: 0,
            fee_delta: null,
            moneyParseError: priceObj.bad || carrierFeeObj.bad,
            originalStatusText: state
          };
        }).filter(Boolean);

      const [current, setCurrent] = useState(val);
      useEffect(() => {
        if (current === val) return;
        const start = performance.now();
        const startVal = current;
        const endVal = val;
        
        const tick = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          setCurrent(startVal + (endVal - startVal) * easeOut);
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, [val, duration]);
      return current;
    }

const productName = typeof _rawName === 'string' ? _rawName.replace(/^\[GENERATED_NAME\]\s*/i, '') : null;

const AnimatedNumber = React.memo(({ value }) => {
  const [displayValue, setDisplayValue] = useState(value);
  const requestRef = useRef();
  const startTimeRef = useRef();
  const previousValueRef = useRef(value);

  useEffect(() => {
    if (value === displayValue) return;
    
    const animate = time => {
      if (!startTimeRef.current) startTimeRef.current = time;
      const progress = Math.min((time - startTimeRef.current) / 400, 1);
      
      const current = previousValueRef.current + (value - previousValueRef.current) * progress;
      setDisplayValue(current);
      
      if (progress < 1) {
        requestRef.current = requestAnimationFrame(animate);
      } else {
        previousValueRef.current = value;
        setDisplayValue(value);
      }
    };
    
    startTimeRef.current = undefined;
    requestRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(requestRef.current);
  }, [value]);

  return <>{formatTND(displayValue)}</>;
});

                          setIntigoApiKey(e.target.value);
                          localStorage.setItem('intigoApiKey', e.target.value);
                        }}
                        placeholder="ألصق مفتاح Intigo API هنا"
                        className="bg-transparent border-none outline-none text-xs w-full text-ink font-mono tracking-widest"
                        dir="ltr"
                      />
                    </div>
                  </div>

                  {/* Row C: Controls */}
                  <div className="flex flex-wrap items-center justify-end gap-2 shrink-0 w-full md:w-auto">
                    <button onClick={handleClearCache} className="shrink-0 flex items-center gap-1.5 px-4 min-h-[44px] bg-transparent border border-line text-ink-soft hover:text-brand hover:border-brand transition-colors rounded-full text-xs font-bold" aria-label="مسح ذاكرة المنتجات" title="مسح ذاكرة المنتجات وتحديث الأسماء">مسح ذاكرة المنتجات</button>
                    <span className={`shrink-0 w-2.5 h-2.5 rounded-full mx-1 ${healthStatus === 'connected' ? 'bg-pos' : (healthStatus === 'offline' || healthStatus === 'endpoint_unknown') ? 'bg-warn animate-pulse' : healthStatus === 'checking' ? 'bg-brand animate-pulse' : 'bg-neg'}`} title={healthStatus === 'connected' ? 'متصل' : healthStatus === 'offline' ? 'غير متصل' : healthStatus === 'endpoint_unknown' ? 'تعذّر التحقق من الصحة — سيتم التأكد عند أول طلب' : healthStatus === 'checking' ? 'جاري التحقق...' : 'مفتاح API غير صالح'}></span>

                    <button
                      type="button"
                      role="switch"
                      aria-checked={theme === 'console'}
                      aria-label={theme === 'console' ? "الوضع النهاري" : "الوضع الليلي"}
                      title={theme === 'console' ? "التبديل إلى الوضع النهاري" : "التبديل إلى الوضع الليلي"}
                      onClick={toggleTheme}
                      className="relative inline-flex shrink-0 items-center min-h-[44px] px-1 select-none cursor-pointer rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand)] bg-transparent border-none"
                      style={{ transition: "background-color 250ms ease, border-color 250ms ease" }}
                    >
                      <span
                        className="relative flex w-14 h-8 shrink-0 items-center rounded-full border"
                        style={{
                          backgroundColor: theme === 'console' ? "var(--surface-2)" : "#E2E7EE",
                          borderColor: "var(--line)",
                          transition: "background-color 250ms ease"
                        }}
                      >
                        <span dir="ltr" className="absolute inset-inline-start-1.5 text-[12px] leading-none" style={{ color: theme === 'console' ? "var(--ink-faint)" : "var(--warn)" }} aria-hidden="true">☀</span>
                        <span dir="ltr" className="absolute inset-inline-end-1.5 text-[12px] leading-none" style={{ color: theme === 'console' ? "var(--brand)" : "var(--ink-faint)" }} aria-hidden="true">☾</span>
                        <span
                          className="absolute top-1 h-6 w-6 rounded-full shadow-sm flex items-center justify-center"
                          style={{
                            insetInlineStart: theme === 'console' ? "calc(100% - 1.75rem)" : "0.25rem",
                            backgroundColor: theme === 'console' ? "var(--brand)" : "#FFFFFF",
                            transition: "inset-inline-start 220ms cubic-bezier(.34,1.56,.64,1), background-color 250ms ease"
                          }}
                          aria-hidden="true"
                        />
                      </span>
                    </button>

                    <button onClick={handleNewCompanyClick} className="shrink-0 flex items-center gap-1.5 px-4 min-h-[44px] bg-transparent border border-line text-ink-soft hover:text-brand hover:border-brand transition-colors rounded-full text-xs font-bold" aria-label="مسح الجلسة الحالية والبدء بشركة توصيل أخرى" title="مسح الجلسة الحالية والبدء بشركة توصيل أخرى">
                      <span>شركة جديدة</span>
                      <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    </button>
                  </div>
                </div>
              </div>
            </header>

            {/* Search/Filter Bar */}
            <div className="bg-bg/95 backdrop-blur border-b border-line px-4 md:px-6 py-3">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center gap-3 md:gap-6">
              <div className="flex-1 flex items-center gap-2 bg-surface border border-line rounded-lg px-3 py-1.5 focus-within:border-brand focus-within:ring-1 focus-within:ring-brand transition-all">
                <span className="text-ink-soft text-sm">🔍</span>
                <input 
                  type="text" 
                  className="bg-transparent border-none outline-none w-full text-sm text-ink placeholder-ink-faint"
                  placeholder="بحث عن منتج، باركود، هاتف..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                />
              </div>
              <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                {['all', 'delivered', 'returned', 'in_progress', 'cancelled', 'error'].map(status => {
                  const label = status === 'all' ? 'الكل' : status === 'delivered' ? 'مُسلّم' : status === 'returned' ? 'مسترجع' : status === 'in_progress' ? 'قيد التنفيذ' : status === 'cancelled' ? 'ملغي' : '⚠ خطأ';
                  const active = filterStatus === status;
                  return (
                    <button 
                      key={status}
                      aria-pressed={active}
                      onClick={() => setFilterStatus(status)}
                      className={`focus-visible:ring-2 focus-visible:ring-brand focus:outline-none whitespace-nowrap px-3 py-1.5 min-h-[44px] rounded-full text-xs font-medium transition-colors ${active ? 'bg-ink text-surface' : 'bg-surface border border-line text-ink-soft hover:bg-surface-2'}`}
                    >
                      {label}
                    </button>
                  );
                })}
              </div>
              <div className="flex items-center gap-2 whitespace-nowrap">
                <select 
                  className="text-xs bg-surface border border-line rounded-lg px-3 py-2 text-ink outline-none focus:border-brand"
                  value={sortOption}
                  onChange={(e) => setSortOption(e.target.value)}
                >
                  <option value="default">الترتيب الافتراضي</option>
                  <option value="price-desc">السعر (الأعلى)</option>
                  <option value="price-asc">السعر (الأقل)</option>
                  <option value="city">الولاية</option>
                  <option value="status">الحالة</option>
                  <option value="product">الاسم (أ - ي)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

          <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 flex flex-col gap-6">
            {/* Upload Zone */}
            {(!masterRows.length && !cakadoRows.length && !balkisRows.length) && (
              <label 
                className="border-2 border-dashed border-line bg-surface hover:bg-surface-2 transition-colors rounded-xl p-12 flex flex-col items-center justify-center cursor-pointer text-center group"
                onDrop={onDropFile}
                onDragOver={handleDragOver}
              >
                <div className="w-16 h-16 bg-surface-2 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                  <svg className="w-8 h-8 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <span className="font-display text-xl text-ink mb-2">اسحب الطلبات إلى هنا</span>
                <span className="text-sm text-ink-soft">أو انقر لاختيار ملف (.xlsx, .csv)</span>
                <span className="text-xs text-ink-faint mt-4 bg-surface-2 px-3 py-1.5 rounded-full">الحالات محدّثة حتى تاريخ تصدير الملف — أعد رفع الملف لتحديثها.</span>
                <input type="file" accept=".xlsx,.csv" className="hidden" onChange={onFileInputChange} />
              </label>
            )}

            {/* Toasts / Errors */}
            {error && (
              <div className="bg-warn/10 text-warn border border-warn/20 rounded-lg p-4 flex items-center gap-3">
                <svg className="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p className="text-sm font-medium">{error}</p>
              </div>
            )}
            {autoFeesInfo && (
              <div className="bg-pos/10 text-pos border border-pos/20 rounded-lg p-4 flex items-center gap-3">
                <svg className="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p className="text-sm font-medium">تم ضبط الرسوم تلقائياً من Logista.</p>
              </div>
            )}
            
            {unrecognizedStatuses.length > 0 && (
              <div className="bg-warn/10 text-warn border border-warn/20 rounded-lg p-4 flex items-start gap-3 relative animate-in fade-in slide-in-from-top-2">
                <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div className="flex-1">
                  <p className="text-sm font-medium mb-1">حالات غير معروفة لم تُحتسب ضمن الإيرادات — راجع التصنيف:</p>
                  <p className="text-xs opacity-80 font-mono" dir="ltr">{unrecognizedStatuses.slice(0, 6).join(', ')}{unrecognizedStatuses.length > 6 ? ' و...' : ''}</p>
                </div>
                <button onClick={() => setUnrecognizedStatuses([])} className="absolute left-1 top-1 opacity-60 hover:opacity-100 p-3 min-h-[44px] min-w-[44px] flex items-center justify-center">
                   <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
              </div>
            )}
            
            {duplicateNids.length > 0 && (
              <div className="bg-warn/10 text-warn border border-warn/20 rounded-lg p-4 flex items-start gap-3 relative animate-in fade-in slide-in-from-top-2">
                <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div className="flex-1">
                  <p className="text-sm font-medium mb-1">تم العثور على {duplicateNids.length} معرفات (NID) مكررة في الملف وتم تجاهل التكرار:</p>
                  <p className="text-xs opacity-80 font-mono" dir="ltr">{duplicateNids.slice(0, 6).join(', ')}{duplicateNids.length > 6 ? ' و...' : ''}</p>
                </div>
                <button onClick={() => setDuplicateNids([])} className="absolute left-1 top-1 opacity-60 hover:opacity-100 p-3 min-h-[44px] min-w-[44px] flex items-center justify-center">
                   <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
              </div>
            )}
            
            {!dismissedUnknownGovs && (cakadoStats.newUnknownGovs.length > 0 || balkisStats.newUnknownGovs.length > 0) && (
               (() => {
                 const unk = [...new Set([...cakadoStats.newUnknownGovs, ...balkisStats.newUnknownGovs])];
                 if (unk.length > 0) {
                   return (
                     <div className="bg-warn/10 text-warn border border-warn/20 rounded-lg p-4 flex items-start gap-3 relative animate-in fade-in slide-in-from-top-2">
                        <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <div className="flex-1">
                           <p className="text-sm font-medium mb-1">ولايات غير معروفة في خريطة الرسوم (تم احتساب 2 د.ت):</p>
                           <p className="text-xs opacity-80" dir="ltr">{unk.slice(0, 6).join(', ')}{unk.length > 6 ? ' و...' : ''}</p>
                           <p className="text-xs opacity-80 mt-1">أضفها لتفادي الخطأ.</p>
                        </div>
                        <button onClick={() => setDismissedUnknownGovs(true)} className="absolute left-1 top-1 opacity-60 hover:opacity-100 p-3 min-h-[44px] min-w-[44px] flex items-center justify-center">
                           <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                     </div>
                   );
                 }
                 return null;
               })()
            )}
            

            {(masterRows.length > 0 || cakadoRows.length > 0 || balkisRows.length > 0) && (
              <>
                {/* Instruments */}
                <div className="flex flex-col md:flex-row gap-6">
                  <BrandSummaryCard title="كاكادو (CAKADO)" stats={cakadoStats} />
                  <BrandSummaryCard title="بلقيس (Balkis)" stats={balkisStats} />
                </div>

                {/* Trays */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="order-1 lg:order-none">{renderTable(viewMaster, 'غير مصنفة', 'master', true, '')}</div>
                  <div className="order-2 lg:order-none">
                    {renderTable(viewCakado, 'كاكادو', 'cakado', true, 'var(--brand)')}
                    {renderFeeInputs(cakadoFees, setCakadoFees, isIntigoLocked)}
                  </div>
                  <div className="order-3 lg:order-none">
                    {renderTable(viewBalkis, 'بلقيس', 'balkis', true, '#3b82f6')}
                    {renderFeeInputs(balkisFees, setBalkisFees, isIntigoLocked)}
                  </div>
                </div>
              </>
            )}

            {/* Floating Selection Bar */}
            {selectedIds.size > 0 && (
              <div className="fixed bottom-0 left-0 right-0 p-4 z-50 pointer-events-none">
                <div className="max-w-3xl mx-auto bg-surface border border-line text-ink rounded-2xl shadow-xl p-3 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-auto surface-highlight">
                  <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start px-2">
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm bg-brand text-white px-2.5 py-0.5 rounded-full shadow-sm">{selectedIds.size}</span>
                      <span className="text-ink-soft font-medium text-sm">محدد</span>
                    </div>
                    <button onClick={() => setSelectedIds(new Set())} className="text-ink-faint hover:text-ink text-sm font-medium px-2 py-1 rounded transition-colors">إلغاء</button>
                  </div>
                  <div className="flex gap-2 w-full sm:w-auto overflow-x-auto hide-scrollbar">
                    <button onClick={() => moveSelected('master')} className="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 bg-surface-2 hover:bg-line text-ink rounded-xl text-sm font-bold transition-all hover:-translate-y-0.5">
                      إلى غير مصنفة
                    </button>
                    <button onClick={() => moveSelected('cakado')} className="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 bg-brand hover:bg-brand/90 text-white rounded-xl text-sm font-bold transition-all hover:-translate-y-0.5 shadow-sm shadow-brand/20">
                      تعيين كاكادو
                    </button>
                    <button onClick={() => moveSelected('balkis')} className="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold transition-all hover:-translate-y-0.5 shadow-sm shadow-blue-600/20">
                      تعيين بلقيس
                    </button>
                  </div>
                </div>
              </div>
            )}
            
            {/* Reset Modal */}
            {showResetModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-[#0B1220]/60 backdrop-blur-sm transition-opacity" onClick={() => setShowResetModal(false)}></div>
                <div className="relative bg-surface border border-line rounded-xl shadow-2xl p-6 max-w-sm w-full animate-in fade-in zoom-in-95 duration-200">
                  <h2 className="font-display text-xl text-ink mb-2">بدء جلسة جديدة؟</h2>
                  <p className="text-ink-soft text-sm mb-6 leading-relaxed">
                    سيتم مسح جميع الطلبات المصنّفة والنتائج الحالية لشركة التوصيل هذه. لا يمكن التراجع عن هذا الإجراء.
                  </p>
                  <div className="flex gap-3 justify-end">
                    <button onClick={() => setShowResetModal(false)} className="px-4 py-2 rounded-lg text-sm font-medium text-ink-soft hover:bg-surface-2 border border-transparent transition-colors">إلغاء</button>
                    <button onClick={resetSession} className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-neg hover:bg-neg/90 transition-colors shadow-sm shadow-neg/20">مسح والبدء</button>
                  </div>
                </div>
              </div>
            )}
            {/* Scroll Nav FABs */}
            <div className={`fixed right-4 sm:right-8 flex flex-col gap-2 z-40 transition-all duration-300 ${selectedIds.size > 0 ? 'bottom-[100px]' : 'bottom-6'}`}>
               <button onClick={scrollToTop} className={`p-3 bg-surface border border-line text-ink rounded-full shadow-lg hover:shadow-xl transition-all duration-300 ${scrollPos.top ? 'opacity-0 translate-y-4 pointer-events-none' : 'opacity-100 translate-y-0'}`} aria-label="أعلى الصفحة">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"></path></svg>
               </button>
               <button onClick={scrollToBottom} className={`p-3 bg-surface border border-line text-ink rounded-full shadow-lg hover:shadow-xl transition-all duration-300 ${scrollPos.bottom ? 'opacity-0 -translate-y-4 pointer-events-none' : 'opacity-100 translate-y-0'}`} aria-label="أسفل الصفحة">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
               </button>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
